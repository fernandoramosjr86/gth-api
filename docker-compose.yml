name: gth

services:
  postgres:
    image: postgres:16-alpine
    container_name: gth-postgres
    environment:
      POSTGRES_DB: gth_db
      POSTGRES_USER: gth_user
      POSTGRES_PASSWORD: gth_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gth_user -d gth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gth-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gth_db
      DB_USERNAME: gth_user
      DB_PASSWORD: gth_pass
      SERVER_PORT: 8080
      SPRING_THREADS_VIRTUAL_ENABLED: ${SPRING_THREADS_VIRTUAL_ENABLED:-false}
      SPRING_MAIN_KEEP_ALIVE: true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/gth-front
      dockerfile: Dockerfile
    container_name: gth-front
    ports:
      - "4200:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: gth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gth.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
